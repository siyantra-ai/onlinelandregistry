<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Gold/Amber gradient matching the site's accent -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAA335"/>
      <stop offset="100%" stop-color="#B26C12"/>
    </linearGradient>
    <!-- Soft shadow for the inner icon to give it depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Rectangle with Gold Gradient -->
  <rect width="180" height="180" rx="42" fill="url(#gold-grad)"/>
  
  <!-- House Emblem (White with soft drop shadow) -->
  <g filter="url(#shadow)">
    <!-- Roof -->
    <path d="M40 95L90 45L140 95" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Body of the house -->
    <path d="M56 90V126C56 132.627 61.3726 138 68 138H112C118.627 138 124 132.627 124 126V90" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Doorway -->
    <path d="M80 138V114C80 108.477 84.4772 104 90 104C95.5228 104 100 108.477 100 114V138" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
