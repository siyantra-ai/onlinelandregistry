kind = "web"
previewPath = "/"
title = "Onlinelandregistry.uk"
version = "1.0.0"
id = "artifacts/land-registry"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22692

[services.development]
run = "pnpm --filter @workspace/land-registry run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/land-registry", "run", "build" ]
publicDir = "artifacts/land-registry/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22692"
BASE_PATH = "/"
